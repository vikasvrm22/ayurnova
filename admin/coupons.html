<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — AyurVeda Store Admin</title><link rel="stylesheet" href="css/admin.css"><script src="js/api.js"></script>
<script>requireAdminAuth();</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">AyurVeda Store <span>Admin</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a><a href="products-list.html">Products</a><a href="orders-list.html">Orders</a>
      <a href="customers.html">Customers</a><a href="coupons.html" class="active">Coupons</a><a href="reviews.html">Reviews</a>
      <a href="blog.html">Blog Posts</a><a href="discovery.html">Discovery</a><a href="faqs.html">FAQs</a><a href="wellness.html">Wellness</a><a href="inventory.html">Inventory</a><a href="returns.html">Returns</a><a href="vaidya-bookings.html">Vaidya Bookings</a><a href="users.html">Users &amp; Roles</a>
      <a href="payments-list.html">Payments</a>
      <a href="invoices.html">Invoices</a>
      <a href="integrations.html">Integrations</a>
      <a href="notifications.html">Notifications</a>
      <a href="legal-pages.html">Legal Pages</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-user"><div class="name"></div><div class="role-badge"></div>
      <button id="change-password-btn">Change Password</button><button onclick="Api.clearSession(); location.href='login.html';">Log out</button></div>
  </aside>
  <main class="main-area">
    <div class="page-header"><h2>Coupons</h2><button class="btn btn-primary" id="new-coupon-btn">+ New Coupon</button></div>
    <table class="data-table">
      <thead><tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Used / Limit</th><th>Active</th><th></th></tr></thead>
      <tbody id="coupons-rows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
  </main>
</div>
<script src="js/pages/changePassword.js"></script>
<script>
  function fmt(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }

  async function load() {
    try {
      const { items } = await Api.get("/coupons");
      document.getElementById("coupons-rows").innerHTML = items.length ? items.map(c => `
        <tr>
          <td><b>${c.code}</b></td>
          <td>${c.discount_type === "percent" ? c.discount_value + "%" : fmt(c.discount_value)}</td>
          <td>${fmt(c.min_order_value || 0)}</td>
          <td>${c.used_count} / ${c.usage_limit || "∞"}</td>
          <td><label class="switch"><input type="checkbox" ${c.active ? "checked" : ""} onchange="toggleActive('${c.id}', this.checked)"><span class="slider"></span></label></td>
          <td><button class="btn btn-danger" onclick="removeCoupon('${c.id}')">Delete</button></td>
        </tr>`).join("") : `<tr><td colspan="6">No coupons yet.</td></tr>`;
    } catch (e) {
      document.getElementById("coupons-rows").innerHTML = `<tr><td colspan="6">Could not load: ${e.message}</td></tr>`;
    }
  }

  async function toggleActive(id, active) {
    try { await Api.put(`/coupons/${id}`, { active }); Toast.show("Updated", "success"); }
    catch (e) { Toast.show(e.message, "error"); load(); }
  }
  async function removeCoupon(id) {
    if (!confirm("Delete this coupon?")) return;
    try { await Api.del(`/coupons/${id}`); Toast.show("Deleted", "success"); load(); }
    catch (e) { Toast.show(e.message, "error"); }
  }

  document.getElementById("new-coupon-btn").addEventListener("click", () => {
    const backdrop = document.createElement("div");
    backdrop.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:998;";
    backdrop.innerHTML = `
      <div style="background:#fff;border-radius:10px;padding:22px;width:360px;">
        <h3 style="margin-top:0;">New Coupon</h3>
        <div class="form-field"><label>Code</label><input id="nc-code" placeholder="e.g. NEW10"></div>
        <div class="form-field" style="margin-top:8px;"><label>Discount Type</label>
          <select id="nc-type"><option value="percent">Percent (%)</option><option value="flat">Flat (₹)</option></select></div>
        <div class="form-field" style="margin-top:8px;"><label>Discount Value</label><input type="number" id="nc-value"></div>
        <div class="form-field" style="margin-top:8px;"><label>Minimum Order Value (₹)</label><input type="number" id="nc-min" value="0"></div>
        <div class="form-field" style="margin-top:8px;"><label>Usage Limit (optional)</label><input type="number" id="nc-limit"></div>
        <div id="nc-error" style="color:#b91c1c; font-size:12px; margin-top:8px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button class="btn btn-outline" id="nc-cancel">Cancel</button>
          <button class="btn btn-primary" id="nc-save">Create</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector("#nc-cancel").onclick = () => backdrop.remove();
    backdrop.querySelector("#nc-save").onclick = async () => {
      try {
        await Api.post("/coupons", {
          code: backdrop.querySelector("#nc-code").value.trim(),
          discount_type: backdrop.querySelector("#nc-type").value,
          discount_value: Number(backdrop.querySelector("#nc-value").value),
          min_order_value: Number(backdrop.querySelector("#nc-min").value || 0),
          usage_limit: backdrop.querySelector("#nc-limit").value ? Number(backdrop.querySelector("#nc-limit").value) : null,
        });
        backdrop.remove();
        Toast.show("Coupon created", "success");
        load();
      } catch (e) {
        backdrop.querySelector("#nc-error").textContent = e.message;
      }
    };
  });

  load();
</script>
</body>
</html>
