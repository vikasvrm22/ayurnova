<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — AyurVeda Store Admin [WIREFRAME]</title>
<link rel="stylesheet" href="css/admin.css">
<script src="js/api.js"></script>
<script>requireAdminAuth();</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">AyurVeda Store <span>Admin</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products-list.html">Products</a>
      <a href="orders-list.html" class="active">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="coupons.html">Coupons</a>
      <a href="reviews.html">Reviews</a>
      <a href="blog.html">Blog Posts</a>
      <a href="vaidya-bookings.html">Vaidya Bookings</a>
      <a href="users.html">Users &amp; Roles</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-user">
      <div class="name">Vikas Sharma</div>
      <div class="role-badge">Store Admin</div>
      <button id="change-password-btn">Change Password</button>
      <button onclick="Api.clearSession(); location.href='login.html';">Log out</button>
    </div>
  </aside>

  <main class="main-area">
    <div class="page-header"><h2>Orders</h2><button class="btn btn-outline">Export CSV</button></div>

    <div class="filters-row">
      <input type="text" id="f-search" placeholder="Search order ID or email/phone...">
      <select id="f-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select>
    </div>

    <table class="data-table">
      <thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
      <tbody id="orders-rows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
    <div style="display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13px;" id="pagination"></div>
  </main>
</div>
<script src="js/pages/changePassword.js"></script>
<script>
  const state = { page: 1, pageSize: 20 };
  function fmt(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }

  async function load() {
    const q = document.getElementById("f-search").value;
    const status = document.getElementById("f-status").value;
    const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });
    if (q) params.set("q", q);
    if (status) params.set("status", status);
    try {
      const data = await Api.get(`/orders?${params.toString()}`);
      document.getElementById("orders-rows").innerHTML = data.items.length
        ? data.items.map(o => `
          <tr>
            <td>${o.order_number}</td>
            <td>${o.guest_email || o.guest_phone || "-"}</td>
            <td>${fmt(o.total)}</td>
            <td>${o.payment_method === "cod" ? "COD" : "Prepaid"}</td>
            <td><span class="badge badge-${o.status}">${o.status}</span></td>
            <td><a href="order-detail.html?id=${o.id}">View →</a></td>
          </tr>`).join("")
        : `<tr><td colspan="6">No orders found.</td></tr>`;

      const totalPages = Math.max(1, Math.ceil(data.total / state.pageSize));
      document.getElementById("pagination").innerHTML = `
        <button class="btn btn-outline" id="pg-prev" ${state.page <= 1 ? "disabled" : ""}>Prev</button>
        <span>Page ${state.page} of ${totalPages} (${data.total} total)</span>
        <button class="btn btn-outline" id="pg-next" ${state.page >= totalPages ? "disabled" : ""}>Next</button>`;
      document.getElementById("pg-prev")?.addEventListener("click", () => { state.page--; load(); });
      document.getElementById("pg-next")?.addEventListener("click", () => { state.page++; load(); });
    } catch (e) {
      document.getElementById("orders-rows").innerHTML = `<tr><td colspan="6">Could not load: ${e.message}</td></tr>`;
    }
  }
  document.getElementById("f-search").addEventListener("input", () => { state.page = 1; load(); });
  document.getElementById("f-status").addEventListener("change", () => { state.page = 1; load(); });
  load();
</script>
</body>
</html>
