<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaidya Bookings — AyurNova Admin</title><link rel="stylesheet" href="css/admin.css"><script src="js/api.js"></script>
<script>requireAdminAuth();</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4C13 4 6 13 6 24c0 4 1.3 8.4 4.3 12.4C13.6 40.8 18.3 44 24 44c5.7 0 10.4-3.2 13.7-7.6C40.7 32.4 42 28 42 24 42 13 35 4 24 4z" fill="currentColor" opacity=".12"/><path d="M24 6C16 12 12 19 12 26c0 6 4 11 12 15 8-4 12-9 12-15 0-7-4-14-12-20z" fill="currentColor"/><path d="M24 10v26" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></svg><span class="sidebar-brand-text">AyurNova<em>Admin Portal</em></span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a><a href="products-list.html">Products</a><a href="orders-list.html">Orders</a>
      <a href="customers.html">Customers</a><a href="coupons.html">Coupons</a><a href="reviews.html">Reviews</a>
      <a href="blog.html">Blog Posts</a><a href="discovery.html">Discovery</a><a href="faqs.html">FAQs</a><a href="wellness.html">Wellness</a><a href="inventory.html">Inventory</a><a href="returns.html">Returns</a><a href="vaidya-bookings.html" class="active">Vaidya Bookings</a><a href="users.html">Users &amp; Roles</a>
      <a href="payments-list.html">Payments</a>
      <a href="invoices.html">Invoices</a>
      <a href="integrations.html">Integrations</a>
      <a href="notifications.html">Notifications</a>
      <a href="legal-pages.html">Legal Pages</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-user"><div class="name"></div><div class="role-badge"></div>
      <button id="change-password-btn">Change Password</button><button onclick="Api.clearSession(); location.href='login.html';">Log out</button></div>
  </aside>
  <main class="main-area">
    <div class="page-header"><h2>Consult-a-Vaidya Bookings</h2></div>
    <table class="data-table">
      <thead><tr><th>Name</th><th>Phone</th><th>Concern</th><th>Preferred Vaidya</th><th>Status</th><th></th></tr></thead>
      <tbody id="bookings-rows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
  </main>
</div>
<script src="js/pages/changePassword.js"></script>
<script>
  async function load() {
    try {
      const { items } = await Api.get("/vaidya-bookings");
      document.getElementById("bookings-rows").innerHTML = items.length ? items.map(b => `
        <tr>
          <td>${b.full_name}</td><td>${b.phone}</td><td>${b.concern || "-"}</td><td>${b.preferred_vaidya || "Any"}</td>
          <td><select onchange="updateStatus('${b.id}', this.value)">
            ${["pending","confirmed","completed","cancelled"].map(s => `<option value="${s}" ${b.status===s?"selected":""}>${s}</option>`).join("")}
          </select></td>
          <td>${b.description || "-"}</td>
        </tr>`).join("") : `<tr><td colspan="6">No bookings yet.</td></tr>`;
    } catch (e) {
      document.getElementById("bookings-rows").innerHTML = `<tr><td colspan="6">Could not load: ${e.message}</td></tr>`;
    }
  }
  async function updateStatus(id, status) {
    try { await Api.put(`/vaidya-bookings/${id}/status`, { status }); Toast.show("Updated", "success"); }
    catch (e) { Toast.show(e.message, "error"); load(); }
  }
  load();
</script>
</body>
</html>
