<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — AyurVeda Store Admin [WIREFRAME]</title>
<link rel="stylesheet" href="css/admin.css">
<script src="js/api.js"></script>
<script>requireAdminAuth();</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">AyurVeda Store <span>Admin</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products-list.html" class="active">Products</a>
      <a href="orders-list.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="coupons.html">Coupons</a>
      <a href="reviews.html">Reviews</a>
      <a href="blog.html">Blog Posts</a><a href="discovery.html">Discovery</a><a href="faqs.html">FAQs</a><a href="wellness.html">Wellness</a><a href="inventory.html">Inventory</a><a href="returns.html">Returns</a>
      <a href="vaidya-bookings.html">Vaidya Bookings</a>
      <a href="users.html">Users &amp; Roles</a>
      <a href="payments-list.html">Payments</a>
      <a href="integrations.html">Integrations</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-user">
      <div class="name">Vikas Sharma</div>
      <div class="role-badge">Store Admin</div>
      <button id="change-password-btn">Change Password</button>
      <button onclick="Api.clearSession(); location.href='login.html';">Log out</button>
    </div>
  </aside>

  <main class="main-area">
    <div class="page-header">
      <h2>Products</h2>
      <a class="btn btn-primary" href="product-form.html">+ Add Product</a>
    </div>

    <div class="filters-row">
      <input type="text" id="f-search" placeholder="Search products...">
      <select id="f-status"><option value="">All statuses</option><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select>
      <select id="bulk-action"><option value="">Bulk action...</option><option value="publish">Publish</option><option value="archive">Archive</option></select>
      <button class="btn btn-outline" id="bulk-apply">Apply</button>
    </div>

    <table class="data-table">
      <thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody id="products-rows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
    <div style="display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13px;" id="pagination"></div>
  </main>
</div>
<script src="js/pages/changePassword.js"></script>
<script>
  const state = { page: 1, pageSize: 20, selected: new Set() };

  function stockBadge(variants) {
    const totalStock = (variants || []).reduce((s, v) => s + v.stock, 0);
    if (totalStock === 0) return `<span class="badge badge-outofstock">Out of Stock</span>`;
    if (totalStock <= 15) return `<span class="badge badge-lowstock">Low Stock (${totalStock})</span>`;
    return `<span class="badge badge-instock">In Stock (${totalStock})</span>`;
  }
  function minPrice(variants) {
    if (!variants || !variants.length) return "-";
    return "₹" + Math.min(...variants.map(v => v.price));
  }

  async function load() {
    const q = document.getElementById("f-search").value;
    const status = document.getElementById("f-status").value;
    const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });
    if (q) params.set("q", q);
    if (status) params.set("status", status);
    try {
      const data = await Api.get(`/products?${params.toString()}`);
      const rowsEl = document.getElementById("products-rows");
      if (!data.items.length) { rowsEl.innerHTML = `<tr><td colspan="6">No products found.</td></tr>`; return; }
      rowsEl.innerHTML = data.items.map(p => `
        <tr>
          <td><input type="checkbox" class="row-check" data-id="${p.id}" ${state.selected.has(p.id) ? "checked" : ""}></td>
          <td><span class="thumb" style="${p.product_images?.[0] ? `background-image:url('${p.product_images[0].url}');background-size:cover;` : ""}"></span>${p.title} <span class="badge badge-${p.status}">${p.status}</span></td>
          <td>-</td>
          <td>${minPrice(p.product_variants)}</td>
          <td>${stockBadge(p.product_variants)}</td>
          <td><a href="product-form.html?id=${p.id}">Edit →</a></td>
        </tr>`).join("");
      rowsEl.querySelectorAll(".row-check").forEach(cb => cb.addEventListener("change", e => {
        if (e.target.checked) state.selected.add(e.target.dataset.id); else state.selected.delete(e.target.dataset.id);
      }));

      const totalPages = Math.max(1, Math.ceil(data.total / state.pageSize));
      document.getElementById("pagination").innerHTML = `
        <button class="btn btn-outline" id="pg-prev" ${state.page <= 1 ? "disabled" : ""}>Prev</button>
        <span>Page ${state.page} of ${totalPages} (${data.total} total)</span>
        <button class="btn btn-outline" id="pg-next" ${state.page >= totalPages ? "disabled" : ""}>Next</button>`;
      document.getElementById("pg-prev")?.addEventListener("click", () => { state.page--; load(); });
      document.getElementById("pg-next")?.addEventListener("click", () => { state.page++; load(); });
    } catch (e) {
      document.getElementById("products-rows").innerHTML = `<tr><td colspan="6">Could not load: ${e.message}</td></tr>`;
    }
  }

  document.getElementById("f-search").addEventListener("input", () => { state.page = 1; load(); });
  document.getElementById("f-status").addEventListener("change", () => { state.page = 1; load(); });
  document.getElementById("bulk-apply").addEventListener("click", async () => {
    const action = document.getElementById("bulk-action").value;
    if (!action || state.selected.size === 0) return;
    for (const id of state.selected) {
      await Api.post(`/products/${id}/${action}`, {}).catch(() => {});
    }
    Toast.show(`Bulk ${action} applied to ${state.selected.size} product(s)`, "success");
    state.selected.clear();
    load();
  });

  load();
</script>
</body>
</html>
