<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyurVeda Store Admin — Login</title><link rel="stylesheet" href="css/admin.css">
<script src="js/api.js"></script>
</head>
<body>
<div class="login-screen">
  <form class="login-box" id="login-form">
    <h1>AyurVeda Store Admin</h1>
    <label>Email</label><input type="email" id="login-email" required>
    <label>Password</label><input type="password" id="login-password" required>
    <div id="login-error" style="color:#b91c1c; font-size:12.5px; margin-top:8px; min-height:14px;"></div>
    <button type="submit">Log in</button>
  </form>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      const data = await Api.post("/auth/login", { email, password });
      Api.setSession(data.token, data.user);
      location.href = "dashboard.html";
    } catch (err) {
      errEl.textContent = err.message || "Login failed";
    }
  });
</script>
</body>
</html>
