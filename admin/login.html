<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyurNova Admin — Login</title><link rel="stylesheet" href="css/admin.css">
<script src="js/api.js"></script>
</head>
<body>
<div class="login-screen">
  <div class="login-wrap">
    <div class="login-side">
      <div class="login-side-brand"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4C13 4 6 13 6 24c0 4 1.3 8.4 4.3 12.4C13.6 40.8 18.3 44 24 44c5.7 0 10.4-3.2 13.7-7.6C40.7 32.4 42 28 42 24 42 13 35 4 24 4z" fill="currentColor" opacity=".12"/><path d="M24 6C16 12 12 19 12 26c0 6 4 11 12 15 8-4 12-9 12-15 0-7-4-14-12-20z" fill="currentColor"/><path d="M24 10v26" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></svg><span>AyurNova<em>Admin Portal</em></span></div>
      <h2>Manage Wellness for a Healthier Tomorrow</h2>
      <ul class="login-side-list">
        <li>Manage Products</li>
        <li>Process Orders</li>
        <li>Support Customers</li>
        <li>Grow with Purpose</li>
      </ul>
      <p class="login-side-quote">Pure Products. Better Lives.</p>
    </div>
    <form class="login-box" id="login-form">
      <h1>Welcome Back</h1>
      <p class="login-sub">Login to access the AyurNova Admin Portal</p>
      <label>Email Address</label><input type="email" id="login-email" required autocomplete="username">
      <label>Password</label><input type="password" id="login-password" required autocomplete="current-password">
      <div id="login-error" style="color:#b91c1c; font-size:12.5px; margin-top:8px; min-height:14px;"></div>
      <button type="submit">Login</button>
      <p class="login-footnote">Only authorized admin accounts can access this portal.</p>
    </form>
  </div>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      const data = await Api.post("/auth/login", { email, password });
      Api.setSession(data.token, data.user);
      location.href = "dashboard.html";
    } catch (err) {
      errEl.textContent = err.message || "Login failed";
    }
  });
</script>
</body>
</html>
